name: Native CI and release packages

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    # Intentionally no publish input: manual runs ONLY create downloadable artifacts.

# PRs (including forks) have no write token, custom secrets or privileged trigger.
permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            # Portable ZIP must not require a separately installed VC++ runtime.
            rustflags: '-C target-feature=+crt-static'
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          # Oldest hosted Ubuntu baseline to avoid unnecessarily new glibc.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      RUSTFLAGS: ${{ matrix.rustflags || '' }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - name: Checkout exact event revision without saved credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python (packaging uses only stdlib)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check release tag against workspace version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package.py version --tag "$RELEASE_TAG"
      - name: Install Linux Slint tray, desktop, D-Bus and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libgtk-3-dev libxdo-dev libayatana-appindicator3-dev \
            libdbus-1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libudev-dev libfontconfig1-dev \
            libfreetype6-dev libegl1-mesa-dev dpkg-dev desktop-file-utils
      - name: Install locked toolchain components and verify native host
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
          rustup target add "$NATIVE_TARGET"
          rustc --version --verbose
          rustc --version --verbose | grep -F "host: $NATIVE_TARGET"
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Clippy all workspace targets with locked dependencies
        run: cargo clippy --locked --workspace --all-targets --target '${{ matrix.target }}' -- -D warnings
      - name: Run native workspace tests
        run: cargo test --locked --workspace --all-targets --target '${{ matrix.target }}'
      - name: Test packaging scripts
        run: |
          python -m unittest discover -s scripts -p 'test_package*.py' -v
          for script in install.sh packaging/install.sh scripts/package-linux.sh; do
            bash -n "$script"
          done
      - name: Check packaging shell scripts (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install --no-install-recommends -y shellcheck
          shellcheck install.sh packaging/install.sh scripts/package-linux.sh
          python scripts/test_install.py
      - name: Build all three release binaries
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/macos' || startsWith(github.ref, 'refs/tags/')
        run: cargo build --locked --release --workspace --bins --target '${{ matrix.target }}'
      - name: Verify CLI and daemon execute without authentication
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/macos' || startsWith(github.ref, 'refs/tags/')
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          "target/$NATIVE_TARGET/release/drcom-cli$suffix" --help
          "target/$NATIVE_TARGET/release/drcom-daemon$suffix" --help
      - name: Locate Inno Setup 6 (install only if runner image lacks it)
        if: runner.os == 'Windows' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/macos' || startsWith(github.ref, 'refs/tags/'))
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --version=6.7.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'ISCC.exe missing' }
          "ISCC=$compiler" >> $env:GITHUB_ENV
      - name: Package native binaries (macOS ad-hoc signed, never notarized)
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/macos' || startsWith(github.ref, 'refs/tags/')
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          REVISION: ${{ github.sha }}
        run: |
          options=()
          if [ "$RUNNER_OS" = Windows ]; then options+=(--iscc "$ISCC"); fi
          python scripts/package.py package --target "$NATIVE_TARGET" --revision "$REVISION" "${options[@]}"
      - name: Upload downloadable native packages and per-asset checksums
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/macos' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.target }}
          path: |
            dist/*
            !dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Assert Cargo.lock was not rewritten
        run: git diff --exit-code -- Cargo.lock

  release:
    name: Publish verified tag assets (never PR or manual dispatch)
    needs: native
    # All four native jobs must succeed. Manual runs, even from tags, NEVER publish.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact trusted tag without saved credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download only packages from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: release-assets
      - name: Verify exact asset set, SHA256 and tag version again
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package.py verify-release --out release-assets --tag "$RELEASE_TAG"
      - name: Publish assets with the only write token in this workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # Refuse replacement/clobber of an existing release. Tag reruns are not silent overwrites.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'A release already exists; refusing to overwrite assets.' >&2
            exit 1
          fi
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag \
            --title "DrCom Campus $RELEASE_TAG" --notes-file packaging/RELEASE-NOTES.txt "${prerelease[@]}"
