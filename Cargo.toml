# DrCom 校园网助手（Rust 版） / drcom-rs
#
# 这是一个 workspace 根清单，本身不再是一个 crate：后端（协议 / 会话 / 应用服务）
# 与所有前端（Slint GUI、CLI、常驻 daemon）分属独立 crate，见 crates/。
#
#   drcom-core      协议、认证会话、网卡/配置/凭据等无界面能力
#   drcom-service   前端无关的应用层：状态快照 + 命令 + 通知（供任意前端复用）
#   drcom-ipc       JSON-lines 前端协议（供非 Rust 前端 / 其他进程接入）
#   drcom-daemon    无界面后端宿主进程（stdio / TCP 暴露 drcom-ipc）
#   drcom-gui       Slint 桌面前端（产物 drcom-campus.exe）
#   drcom-cli       命令行前端（产物 drcom-cli.exe）
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.2.1"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ZincGluxx/drcom-rs"
authors = ["ZincGlux"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# Shipping profile. The defaults (no LTO, 16 codegen units, symbols kept) were
# leaving ~3.5 MB of the GUI binary on the table: Slint compiles to a wide call
# graph that only fat LTO can collapse across crate boundaries.
#
# `strip = true` removes the symbol table only — the icon and version resources
# come from the `.res` file linked in by `crates/drcom-gui/build.rs` and live in
# the resource section, which stripping does not touch.
#
# Not set on purpose:
#   * `panic = "abort"` would skip destructors on the way out, and Slint removes
#     the tray icon from `Drop` — aborting would guarantee the orphaned shell
#     icon this project already had trouble with.
#   * `opt-level = "s"` trades CPU for size; the polling loops here are latency
#     sensitive, so `3` stays.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
